name: 版本测试报告（Version test report）
description: 报告补丁在你的游戏版本上是否可用 / Report whether the unlock works on your game version
title: "[Compat] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        感谢测试！成功的结果会加进 README 的「已测试」表。游戏版本、显示器、补丁设置都在 `log.txt` 里，不用另外填。

        Thanks for testing! Successful reports are added to the README's *Tested* table. Game version, monitor and patch settings are all in `log.txt`.

  - type: dropdown
    id: result
    attributes:
      label: 结果（Result）
      options:
        - 正常（Works）
        - 能用，但部分动画或音符不对（Works, but some animations or notes are off）
        - 安装器拒绝安装（Installer refused to install）
        - 装上了但帧数还是 120（Installed, but FPS stays at 120）
        - 游戏启动不了、崩溃或卡住（Game does not start, crashes or freezes）
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志文件（contents\log.txt）
      description: |
        玩过一局后关掉游戏，把游戏目录里的 `contents\log.txt` 拖进这个框上传。
        Play a round, close the game and drag `contents\log.txt` from the game folder into this box.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充说明（Notes）
      description: 哪里不对，可以附截图 / Anything that looked wrong, screenshots welcome
