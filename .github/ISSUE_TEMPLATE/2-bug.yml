name: 问题反馈（Bug report）
description: 和说明不一致的问题 / Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 README 的「常见问题」。游戏版本、显示器、补丁设置都在 `log.txt` 里，不用另外填。

        Please check the README's troubleshooting section first. Game version, monitor and patch settings are all in `log.txt`.

  - type: textarea
    id: what
    attributes:
      label: 发生了什么（What happened）
      description: 怎么操作、看到了什么 / What you did and what you saw
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志文件（contents\log.txt）
      description: |
        出问题后关掉游戏，把游戏目录里的 `contents\log.txt` 拖进这个框上传。
        Close the game after the problem happens and drag `contents\log.txt` from the game folder into this box.
    validations:
      required: true
