name: 问题反馈（Bug report）
description: 和说明不一致的问题 / Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 README 的「常见问题」。
        > **隐私**：`log.txt` 里可能有卡号（`-card0`）、账号 ID 和网络设置，粘贴前请删掉。

        Please check the README's troubleshooting section first.
        > **Privacy**: `log.txt` may contain your card ID (`-card0`), account ID and network settings. Remove them before pasting.

  - type: input
    id: version
    attributes:
      label: 游戏版本（Game version）
      placeholder: KFC:J:G:A:2026101300
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: 补丁版本（SDVX FPS Unlock version）
      placeholder: v1.1.0
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么（What happened）
      description: 复现步骤和期望结果 / Steps to reproduce and what you expected
    validations:
      required: true

  - type: input
    id: monitor
    attributes:
      label: 显示器（Monitor）
      placeholder: 1080x1920, 180Hz, 竖屏

  - type: textarea
    id: installer
    attributes:
      label: 安装脚本输出（Installer output）
      render: text

  - type: textarea
    id: log
    attributes:
      label: 日志相关片段（Relevant lines from contents\log.txt）
      description: 例如含 patchmanager、graphics::d3d9、gpuinfo 的行 / e.g. lines containing patchmanager, graphics::d3d9 or gpuinfo
      render: text
