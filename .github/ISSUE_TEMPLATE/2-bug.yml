name: 问题反馈（Bug report）
description: 和说明不一致的问题 / Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 README 的「常见问题」。**反馈问题必须附上 `contents\log.txt`**，见最下面。
        > **隐私**：`log.txt` 里可能有卡号（`-card0`）、账号 ID 和网络设置，上传前请删掉。

        Please check the README's troubleshooting section first. **Every report needs `contents\log.txt`** (see the last field).
        > **Privacy**: `log.txt` may contain your card ID (`-card0`), account ID and network settings. Remove them before uploading.

  - type: input
    id: version
    attributes:
      label: 游戏版本（Game version）
      placeholder: KFC:J:G:A:2026101300
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: 补丁版本（SDVX FPS Unlock version）
      placeholder: v1.2.2
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么（What happened）
      description: 复现步骤和期望结果 / Steps to reproduce and what you expected
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: 安装时输入的帧数（FPS entered in the installer）
      placeholder: "170"
    validations:
      required: true

  - type: input
    id: monitor
    attributes:
      label: 显示器（Monitor）
      description: 分辨率、刷新率、横竖屏 / Resolution, refresh rate, orientation
      placeholder: 1440x2560, 170Hz, 竖屏
    validations:
      required: true

  - type: textarea
    id: installer
    attributes:
      label: 安装器截图或输出（Installer screenshot or output）
      description: 可以直接粘贴截图 / Pasting a screenshot is fine

  - type: textarea
    id: log
    attributes:
      label: 日志文件（contents\log.txt）
      description: |
        出问题后关掉游戏，把游戏目录里的 `contents\log.txt` 拖进这个框上传。上传前用记事本删掉卡号（`-card0` 那几行）、PCBID 等个人信息。没有日志基本没法排查。
        Close the game after the problem happens and drag `contents\log.txt` from the game folder into this box. Remove your card ID (`-card0` lines), PCBID and other personal data first. Without the log we can hardly investigate.
    validations:
      required: true
